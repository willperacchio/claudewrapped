<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Claude Wrapped</title>
<meta name="description" content="Your year in Claude Code, Spotify Wrapped style. Computed 100% locally.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
:root{
  --plum:#1A0B2E;--lime:#CCFF3D;--pink:#FF5FA2;--violet:#6B4EFF;--cobalt:#1F3BFF;--mint:#3DF5C0;
  --sun:#FFC93D;--tomato:#FF4D2E;--clay:#D97757;--cream:#F4EFE6;--ink:#0B0B0F;--white:#FFF8EE;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --g1:var(--plum);--g2:var(--lime);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07060B;color:var(--cream);font-family:var(--display);-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#glow{position:fixed;inset:-10%;pointer-events:none;opacity:.42;filter:blur(50px);
  background:radial-gradient(45vmax 45vmax at 18% 22%,var(--g1),transparent 70%),radial-gradient(45vmax 45vmax at 82% 78%,var(--g2),transparent 70%)}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#story{--bg:var(--plum);--fg:var(--cream);--a1:var(--lime);--a2:var(--pink);
  position:relative;width:min(100vw,calc((100dvh - 48px) * 9 / 16),540px);aspect-ratio:9/16;border-radius:28px;overflow:hidden;
  background:var(--bg);color:var(--fg);container-type:inline-size;font-size:4cqw;
  box-shadow:0 40px 140px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);transition:background-color .45s,color .45s;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
@media (max-width:560px){#story{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0}}

/* chrome */
.bars{position:absolute;top:3.4cqw;left:4cqw;right:4cqw;display:flex;gap:1.1cqw;z-index:20}
.bar{flex:1;height:.75cqw;min-height:3px;border-radius:9px;background:color-mix(in srgb,var(--fg) 26%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--fg)}
.top{position:absolute;top:6.4cqw;left:4.2cqw;right:3cqw;display:flex;align-items:center;gap:2cqw;z-index:20;
  font:800 2.9cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.top .demo{background:var(--fg);color:var(--bg);padding:.9cqw 1.8cqw;border-radius:99px;letter-spacing:.08em}
.top .sp{flex:1}
.ibtn{appearance:none;border:0;background:transparent;color:inherit;width:9cqw;height:9cqw;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.ibtn svg{width:4.2cqw;height:4.2cqw}
.ibtn:focus-visible,.btn:focus-visible,.cta:focus-visible{outline:3px solid var(--a1);outline-offset:3px}

/* slides */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:18cqw 7cqw 9cqw;animation:slideIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:scale(1.035)}}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.content{position:relative;z-index:2;display:flex;flex-direction:column;gap:2.8cqw;flex:1;min-height:0}
.content.center{justify-content:center}
.content.mid{justify-content:center}
.spacer{flex:1}

.kicker{font:800 3cqw/1.25 var(--mono);letter-spacing:.15em;text-transform:uppercase}
.lead{font-weight:750;font-size:6cqw;line-height:1.08;letter-spacing:-.025em}
.mega{font-weight:900;font-size:25cqw;line-height:.84;letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.h1{font-weight:900;font-size:13.5cqw;line-height:.88;letter-spacing:-.05em}
.h2{font-weight:850;font-size:8.4cqw;line-height:.95;letter-spacing:-.04em}
.quip{font-weight:650;font-size:4.5cqw;line-height:1.28;letter-spacing:-.01em;text-wrap:pretty}
.quip b{font-weight:850}
.fine{font:600 2.65cqw/1.45 var(--mono);opacity:.72;letter-spacing:.01em}
.a1{color:var(--a1)}.a2{color:var(--a2)}
.chips{display:flex;flex-wrap:wrap;gap:1.8cqw}
.chip{display:inline-flex;align-items:center;gap:1.2cqw;padding:1.7cqw 3.2cqw;border-radius:99px;background:var(--fg);color:var(--bg);
  font-weight:800;font-size:3.5cqw;white-space:nowrap}
.chip.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 .55cqw var(--fg)}

/* motion */
.rise{opacity:0;transform:translateY(5cqw);animation:rise .7s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.pop{opacity:0;transform:scale(.55) rotate(-5deg);animation:pop .85s cubic-bezier(.2,1.5,.35,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:none}}
.slam{opacity:0;animation:slam .7s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(4deg)}55%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
.wobble{animation:wobble 3.2s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-3deg) scale(1.03)}}
#story.paused .slide *,#story.held .slide *{animation-play-state:paused!important}

/* decorations */
.orb{position:absolute;border-radius:50%;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--dx,6cqw),var(--dy,-5cqw)) scale(1.12)}}
.burst{position:absolute;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;border-radius:50%;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.marquee{position:absolute;left:-25%;width:150%;transform:rotate(var(--rot,-8deg));overflow:hidden;white-space:nowrap;
  font-weight:900;font-size:7cqw;letter-spacing:-.02em;padding:1.6cqw 0;line-height:1}
.marquee div{display:inline-block;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--a1) 40%,transparent) 1.1px,transparent 1.4px);background-size:5cqw 5cqw;opacity:.35}
.codelines{position:absolute;right:-14%;top:9%;width:62%;display:flex;flex-direction:column;gap:2.5cqw;transform:rotate(-12deg)}
.codelines i{display:block;height:3.1cqw;border-radius:9px;animation:slideL 1s cubic-bezier(.2,.9,.2,1) both}
@keyframes slideL{from{transform:translateX(70%);opacity:0}}
.bigquote{position:absolute;font-weight:900;line-height:.7;font-size:95cqw;font-family:Georgia,"Times New Roman",serif}
.confetti i{position:absolute;top:-6%;width:2.2cqw;height:3.8cqw;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--sx,0),205cqw) rotate(var(--r,720deg))}}
.gradbg{position:absolute;inset:0;background-size:280% 280%;animation:hue 9s ease-in-out infinite alternate}
@keyframes hue{0%{background-position:0% 30%}100%{background-position:100% 70%}}

/* intro */
.title{position:relative;font-weight:900;font-size:21cqw;line-height:.82;letter-spacing:-.065em;margin:1cqw 0 2cqw}
.title .w{color:var(--a1)}
.yr{position:absolute;right:-1cqw;bottom:-8cqw;background:var(--a2);color:var(--ink);font-size:6.4cqw;letter-spacing:-.03em;padding:1.4cqw 3cqw;border-radius:99px;
  transform:rotate(9deg);line-height:1;animation:wobble 3s ease-in-out infinite}
.cta{appearance:none;border:0;cursor:pointer;background:var(--a1);color:var(--ink);font:900 5.4cqw/1 var(--display);letter-spacing:-.02em;
  padding:4.2cqw 7.5cqw;border-radius:99px;align-self:flex-start;box-shadow:0 1.3cqw 0 #6f8c12;transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px) rotate(-1.5deg)}
.cta:active{transform:translateY(1.1cqw);box-shadow:0 .2cqw 0 #6f8c12}

/* clock */
.clock{width:74cqw;margin:0 auto;display:block;overflow:visible}
.rbar{stroke:color-mix(in srgb,var(--fg) 45%,transparent);stroke-width:5.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw .65s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i) * 32ms + .35s)}
.rbar.peak{stroke:var(--a1)}
@keyframes draw{to{stroke-dashoffset:0}}
.clock text{font:800 9px var(--mono);fill:var(--fg);opacity:.7;text-anchor:middle;dominant-baseline:middle}

/* ranks */
.rank{list-style:none;display:flex;flex-direction:column;gap:.6cqw;margin-top:1cqw}
.rank li{display:grid;grid-template-columns:9cqw 1fr auto;align-items:baseline;gap:2cqw;padding:2.3cqw 0;
  border-bottom:.45cqw solid color-mix(in srgb,var(--fg) 20%,transparent)}
.rank .rn{font-weight:900;font-size:6.6cqw;letter-spacing:-.04em}
.rank .nm{font-weight:850;font-size:6.6cqw;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .ct{font:800 2.9cqw var(--mono);opacity:.7;white-space:nowrap}
.rank li.first{background:var(--a1);color:var(--a2);border:0;border-radius:4.5cqw;padding:4cqw 4cqw;margin-bottom:1.4cqw;
  grid-template-columns:auto 1fr;row-gap:1cqw;transform:rotate(-1.5deg)}
.rank li.first .rn,.rank li.first .nm{font-size:12cqw;line-height:.9}
.rank li.first .ct{grid-column:1/-1;opacity:.85}

/* languages */
.sticker{position:relative;width:74cqw;aspect-ratio:1;display:grid;place-items:center;margin:0 auto}
.sticker svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 36s linear infinite}
.sticker span{position:relative;font-weight:900;font-size:11.5cqw;letter-spacing:-.05em;color:var(--ink);transform:rotate(-8deg);text-align:center;line-height:.9;max-width:62cqw;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:2cqw;justify-content:center}
.pill{padding:1.8cqw 3.6cqw;border-radius:99px;box-shadow:inset 0 0 0 .55cqw var(--fg);font-weight:800;font-size:4.2cqw;white-space:nowrap}
.pill:nth-child(odd){transform:rotate(-3deg)}.pill:nth-child(even){transform:rotate(2.5deg)}
.pill b{color:var(--a1);margin-right:1cqw}

/* terminal */
.term{background:#15151D;border-radius:3.4cqw;box-shadow:0 0 0 .4cqw #2A2A36,0 4cqw 10cqw rgba(0,0,0,.45);overflow:hidden;font:650 3.3cqw/1.45 var(--mono);color:#E9E9EF}
.term-head{display:flex;gap:1.4cqw;align-items:center;padding:2.3cqw 3.2cqw;background:#1F1F2A}
.term-head i{width:2.6cqw;height:2.6cqw;border-radius:50%;background:#FF5F57}
.term-head i:nth-child(2){background:#FEBC2E}.term-head i:nth-child(3){background:#28C840}
.term-head span{margin-left:auto;opacity:.45;font-size:2.7cqw}
.term-body{padding:3cqw 3.4cqw 3.6cqw}
.tp{color:var(--a1);margin-bottom:1.2cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:grid;grid-template-columns:17cqw 1fr 11cqw;align-items:center;gap:2.2cqw;margin-top:1cqw}
.tr .bb{height:2.3cqw;background:#262633;border-radius:9px;overflow:hidden}
.tr .bb b{display:block;height:100%;width:var(--w);background:var(--a1);border-radius:9px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d)}
.tr .tc{text-align:right;opacity:.7}
@keyframes grow{from{transform:scaleX(0)}}
.danger{display:flex;gap:1.8cqw;flex-wrap:wrap}
.danger span{font:800 3.3cqw var(--mono);padding:1.6cqw 2.8cqw;border-radius:2cqw;background:color-mix(in srgb,var(--a2) 22%,transparent);color:var(--a2);box-shadow:inset 0 0 0 .4cqw var(--a2)}
.danger span.zero{opacity:.55}

/* tokens */
.tok{display:flex;align-items:baseline;gap:2.4cqw;flex-wrap:wrap}
.tok .h1{font-size:15cqw}
.costcard{background:var(--a1);color:var(--bg);border-radius:5cqw;padding:5cqw 5.4cqw;transform:rotate(-2deg);display:flex;flex-direction:column;gap:2cqw;margin-top:1cqw}
.costcard .mega{font-size:21cqw}

/* manners */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.vs .col{border-radius:5cqw;padding:4cqw;display:flex;flex-direction:column;gap:2.2cqw}
.vs .nice{background:var(--a1);color:var(--ink);transform:rotate(-1.5deg)}
.vs .spicy{background:var(--ink);color:var(--cream);transform:rotate(1.5deg)}
.vs .emo{font-size:10cqw;line-height:1}
.vs .row{font-weight:700;font-size:3.7cqw;line-height:1.1}
.vs .row b{font-weight:900;font-size:8cqw;display:block;letter-spacing:-.045em;line-height:.95}
.meter{height:4.2cqw;border-radius:99px;background:var(--ink);overflow:hidden;display:flex}
.meter i{display:block;height:100%;width:var(--w);background:var(--a1);transform-origin:left;animation:grow 1.3s .9s cubic-bezier(.2,.9,.2,1) both}
.meterlbl{display:flex;justify-content:space-between;font:800 2.8cqw var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:-1cqw}

/* words */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.stat{background:color-mix(in srgb,var(--ink) 20%,transparent);border-radius:4cqw;padding:3.4cqw 3.6cqw}
.stat b{display:block;font-weight:900;font-size:8.6cqw;letter-spacing:-.045em;line-height:1}
.stat span{display:block;font-weight:700;font-size:3.2cqw;line-height:1.2;opacity:.92;margin-top:.8cqw}
.bigphrase{font-weight:900;font-size:16cqw;line-height:.9;letter-spacing:-.055em;color:var(--a1);white-space:nowrap}

/* calendar */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:min(.75cqw,4px);
  width:min(100%,calc(var(--cols) * 7cqw));aspect-ratio:calc(var(--cols) / 7)}
.heat i{border-radius:22%;background:color-mix(in srgb,var(--fg) 11%,transparent);opacity:0;animation:cell .4s ease-out forwards;animation-delay:calc(var(--i) * 3.5ms + .4s)}
.heat i.l1{background:color-mix(in srgb,var(--a1) 32%,transparent)}
.heat i.l2{background:color-mix(in srgb,var(--a1) 55%,transparent)}
.heat i.l3{background:color-mix(in srgb,var(--a1) 80%,transparent)}
.heat i.l4{background:var(--a1);box-shadow:0 0 1.6cqw color-mix(in srgb,var(--a1) 70%,transparent)}
.heat i.pad{visibility:hidden}
@keyframes cell{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.duo div{border-top:.6cqw solid var(--a1);padding-top:2.2cqw}
.duo b{display:block;font-weight:900;font-size:10cqw;letter-spacing:-.05em;line-height:1}
.duo span{display:block;font-weight:700;font-size:3.4cqw;line-height:1.2;opacity:.9;margin-top:1cqw}

/* personality */
.pemoji{font-size:31cqw;line-height:1;text-align:center;filter:drop-shadow(0 2cqw 0 rgba(0,0,0,.16))}
.pname{font-weight:900;font-size:14cqw;line-height:.86;letter-spacing:-.055em;text-align:center;text-wrap:balance}
.persona .quip{text-align:center;max-width:none}
.persona .chips{justify-content:center}

/* share */
.share{gap:3cqw;align-items:center;justify-content:center}
.cardwrap{width:74cqw;aspect-ratio:4/5;border-radius:3cqw;overflow:hidden;box-shadow:0 5cqw 12cqw rgba(0,0,0,.55),0 0 0 .3cqw rgba(255,255,255,.08);background:#1A0B2E}
.cardwrap img{width:100%;height:100%;display:block}
.actions{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:0;cursor:pointer;font:800 3.7cqw/1 var(--display);padding:3.2cqw 4.6cqw;border-radius:99px;background:#2A2934;color:var(--cream);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--lime);color:var(--ink)}
.opts{display:flex;gap:4cqw;align-items:center;font:700 2.9cqw var(--mono);opacity:.85}
.opts label{display:flex;gap:1.4cqw;align-items:center;cursor:pointer}
.opts input{accent-color:var(--lime);width:3.4cqw;height:3.4cqw}
.linkbtn{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.toast{position:absolute;left:50%;bottom:6cqw;transform:translate(-50%,8cqw);opacity:0;z-index:30;background:var(--cream);color:var(--ink);
  font:800 3.4cqw var(--display);padding:2.8cqw 4.6cqw;border-radius:99px;transition:.3s cubic-bezier(.2,.9,.2,1);pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.hint{position:absolute;bottom:3cqw;left:0;right:0;text-align:center;font:700 2.5cqw var(--mono);opacity:.45;z-index:20;letter-spacing:.06em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}
}
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage">
  <main id="story" aria-live="polite" aria-label="Claude Wrapped story">
    <div class="bars" id="bars"></div>
    <div class="top">
      <span id="brand">Claude Wrapped</span><span class="demo" id="demoChip" hidden>Sample data</span>
      <span class="sp"></span>
      <button class="ibtn" id="pauseBtn" aria-label="Pause"></button>
    </div>
    <div id="slot"></div>
    <div class="toast" id="toast"></div>
  </main>
</div>
<script>window.__WRAPPED__ = /*__WRAPPED_DATA__*/null;</script>
<script>
(() => {
'use strict';

// ---------- palette ----------
const P = { plum:'#1A0B2E', lime:'#CCFF3D', pink:'#FF5FA2', violet:'#6B4EFF', cobalt:'#1F3BFF', mint:'#3DF5C0',
  sun:'#FFC93D', tomato:'#FF4D2E', clay:'#D97757', cream:'#F4EFE6', ink:'#0B0B0F', white:'#FFF8EE' };

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- formatting ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (n) => Math.round(n || 0).toLocaleString('en-US');
const compact = (n) => {
  n = Math.round(n || 0);
  const u = [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for (const [v, s] of u) if (n >= v) { const x = n / v; return (x >= 100 ? Math.round(x) : x >= 10 ? x.toFixed(1) : x.toFixed(2)).toString().replace(/\.?0+$/, '') + s; }
  return String(n);
};
const money = (n) => n >= 100 ? '$' + fmt(n) : '$' + (n || 0).toFixed(2);
const FMT = { int: fmt, compact, money, x: (n) => '×' + fmt(n) };
const hourLabel = (h) => `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const parseDay = (s) => new Date(s + 'T12:00:00');
const niceDate = (s) => { const d = parseDay(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pl = (n, one, many) => (n === 1 ? one : (many || one + 's'));
const num = (n, f = 'int', delay = .35) => `<span data-count="${+n || 0}" data-fmt="${f}" data-delay="${delay}">${FMT[f](0)}</span>`;
const d_ = (s) => `style="--d:${s}s"`;

// ---------- decorations ----------
function starPts(n, ro, ri, cx = 50, cy = 50) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? ri : ro; const a = Math.PI * i / n - Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
const starPath = (n = 14, ro = 50, ri = 40) => 'M' + starPts(n, ro, ri).map((p) => p.map((v) => v.toFixed(2)).join(',')).join('L') + 'Z';
const orb = (c, l, t, s, o = {}) => `<i class="orb" style="background:${c};left:${l};top:${t};width:${s};height:${s};--dx:${o.dx||'6cqw'};--dy:${o.dy||'-5cqw'};animation-duration:${o.t||9}s;opacity:${o.op||1}"></i>`;
const burst = (c, l, t, s, n = 14, spin = 40, ri = 40, rev = false) => `<svg class="burst" viewBox="0 0 100 100" style="left:${l};top:${t};width:${s};height:${s};animation-duration:${spin}s;${rev?'animation-direction:reverse':''}"><path fill="${c}" d="${starPath(n, 50, ri)}"/></svg>`;
const ring = (c, l, t, s, w = 5) => `<i class="ring" style="left:${l};top:${t};width:${s};height:${s};box-shadow:inset 0 0 0 ${w}cqw ${c}"></i>`;
const marquee = (text, bg, fg, top, rot = -8, dur = 14) => {
  const t = esc((text + '  ✦  ').repeat(10));
  return `<div class="marquee" style="top:${top};--rot:${rot}deg;background:${bg};color:${fg}"><div style="animation-duration:${dur}s">${t}${t}</div></div>`;
};
function seeded(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function codeLines(n, colors) {
  const r = seeded(7); let s = '';
  for (let i = 0; i < n; i++) s += `<i style="width:${22 + r() * 62}%;margin-left:${Math.floor(r() * 4) * 7}%;background:${colors[i % colors.length]};animation-delay:${i * 55}ms"></i>`;
  return `<div class="codelines">${s}</div>`;
}
function confetti(n, colors) {
  const r = seeded(42); let s = '';
  for (let i = 0; i < n; i++) s += `<i style="left:${r() * 100}%;background:${colors[i % colors.length]};animation-duration:${3.2 + r() * 3.5}s;animation-delay:${-r() * 6}s;--sx:${(r() - .5) * 30}cqw;--r:${(r() > .5 ? 1 : -1) * (360 + r() * 720)}deg;${r() > .6 ? 'border-radius:50%;height:2.2cqw' : ''}"></i>`;
  return `<div class="deco confetti">${s}</div>`;
}

function minutesQuip(m) {

}
function hourQuip(h) {

function clockSVG(hours, peak) {
  const max = Math.max(1, ...hours); let s = '';
  for (let h = 0; h < 24; h++) {
    const a = (h / 24) * Math.PI * 2 - Math.PI / 2, r0 = 33, r1 = 33 + 3 + (hours[h] / max) * 55;
    const p = (r) => [(100 + Math.cos(a) * r).toFixed(2), (100 + Math.sin(a) * r).toFixed(2)];
    const [x1, y1] = p(r0), [x2, y2] = p(r1);
    s += `<line class="rbar${h === peak ? ' peak' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" pathLength="1" style="--i:${h}"/>`;
  }
  const lbl = [['12a', 0], ['6a', 6], ['12p', 12], ['6p', 18]].map(([t, h]) => { const a = (h / 24) * Math.PI * 2 - Math.PI / 2; return `<text x="${100 + Math.cos(a) * 21}" y="${100 + Math.sin(a) * 21}">${t}</text>`; }).join('');
  return `<svg class="clock" viewBox="0 0 200 200" aria-label="Prompts by hour of day">${s}${lbl}</svg>`;
}

function heatmap(d) {
  const days = d.time.days || {}; const keys = Object.keys(days).sort();
  if (!keys.length) return '';
  const from = parseDay((d.range && d.range.from) || keys[0]), to = parseDay((d.range && d.range.to) || keys[keys.length - 1]);
  const start = new Date(from); start.setDate(start.getDate() - start.getDay());
  const vals = Object.values(days).filter(Boolean).sort((a, b) => a - b);
  const q = (p) => vals[Math.floor(p * (vals.length - 1))];
  const [t1, t2, t3] = [q(.25), q(.55), q(.85)];
  let cells = '', n = 0;
  for (const dt = new Date(start); dt <= to; dt.setDate(dt.getDate() + 1), n++) {
    const v = days[localDay(dt)] || 0;
    const lvl = dt < from ? 'pad' : !v ? 'l0' : v <= t1 ? 'l1' : v <= t2 ? 'l2' : v <= t3 ? 'l3' : 'l4';
    cells += `<i class="${lvl}" style="--i:${n}"></i>`;
  }
  const cols = Math.ceil(n / 7);
  return `<div class="heat" style="--cols:${cols};aspect-ratio:${cols}/7" aria-label="Activity calendar">${cells}</div>`;
}

const SLIDES = buildSlides(D);
let idx = 0, elapsed = 0, last = performance.now(), paused = false, holding = false, noAuto = false;
document.getElementById('demoChip').hidden = !D.demo;
barsEl.innerHTML = SLIDES.slice(1).map(() => '<div class="bar"><i></i></div>').join('');

function fitAll(root) {
  root.querySelectorAll('[data-fit]').forEach((el) => {
    const counts = [...el.querySelectorAll('[data-count]')];
    counts.forEach((c) => { c.textContent = FMT[c.dataset.fmt](+c.dataset.count); });
    el.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    while (el.scrollWidth > el.clientWidth + 1 && guard++ < 40) { fs *= 0.94; el.style.fontSize = fs + 'px'; }
  });
}
function runCounts(root) {
  root.querySelectorAll('[data-count]').forEach((el) => {
    const to = +el.dataset.count, f = FMT[el.dataset.fmt] || fmt;
    if (reduced) { el.textContent = f(to); return; }
    el.textContent = f(0);
    const t0 = performance.now() + (+el.dataset.delay || 0) * 1000, dur = 1500;
    const tick = (now) => {
      if (!el.isConnected) return;
      const k = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = f(k >= 1 ? to : to * (1 - Math.pow(2, -10 * k)));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function show(i) {
  idx = Math.max(0, Math.min(SLIDES.length - 1, i)); elapsed = 0;
  const s = SLIDES[idx];
  for (const [k, v] of Object.entries(s.theme)) story.style.setProperty('--' + k, v);
  document.body.style.setProperty('--g1', s.theme.bg); document.body.style.setProperty('--g2', s.theme.a1);
  const el = document.createElement('section');
  el.className = 'slide'; el.dataset.id = s.id; el.innerHTML = s.html;
  slot.replaceChildren(el);
  fitAll(el); runCounts(el);
  if (s.after) s.after(el);
  barsEl.style.visibility = idx === 0 ? 'hidden' : 'visible';
  updateBars();
}
const next = () => { if (idx < SLIDES.length - 1) show(idx + 1); };
const prev = () => show(idx <= 1 ? idx : idx - 1); // never back to the intro; slide 1 just restarts
function updateBars() {
  const s = SLIDES[idx];
  barFills.forEach((b, j) => {
    const k = j + 1;
    b.style.width = k < idx ? '100%' : k > idx ? '0%' : (s.dur ? Math.min(100, elapsed / s.dur * 100) : 100) + '%';
  });
}
function loop(now) {
  const dt = Math.min(100, now - last); last = now;
  const s = SLIDES[idx];
  if (s.dur && !paused && !holding && !noAuto && !document.hidden) { elapsed += dt; if (elapsed >= s.dur) next(); }
  updateBars();
  requestAnimationFrame(loop);
}

// input
let downAt = null, holdTimer = null;
story.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button,a,input,label')) return;
  downAt = e.clientX;
  holdTimer = setTimeout(() => { holding = true; story.classList.add('held'); }, 230);
});
const endPress = (e, cancel) => {
  if (downAt == null) return;
  clearTimeout(holdTimer);
  const wasHold = holding; holding = false; story.classList.remove('held');
  const xPos = downAt; downAt = null;
  if (cancel || wasHold) return;
  const r = story.getBoundingClientRect();
  if (idx === 0) return next();
  if (xPos - r.left < r.width * 0.3) prev(); else next();
};
story.addEventListener('pointerup', (e) => endPress(e, false));
story.addEventListener('pointercancel', (e) => endPress(e, true));
story.addEventListener('pointerleave', (e) => { if (downAt != null && holding) endPress(e, true); });
story.addEventListener('contextmenu', (e) => e.preventDefault());
pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); setPaused(!paused); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); if (idx === 0) next(); else setPaused(!paused); }
});

story.addEventListener('click', async (e) => {

    catch { try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': await cardBlob() })]); toast('Copied! Paste it into your post.'); } catch { toast('Copy isn’t allowed here. Use Save image.'); } }
